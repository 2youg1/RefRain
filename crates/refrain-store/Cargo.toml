[package]
name = "refrain-store"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Sole persistence authority: app.db, refrain.db, atomic writes, Root guard, Source Backup, index/search/sort, trash, icon sanitising, migrations."

# This crate owns every mutable disk path and both databases. No other crate
# writes a project with std::fs (SPEC 6.2); `verify:write-path` asserts it.
[dependencies]
refrain-core = { workspace = true }
ignore = { workspace = true }
image = { workspace = true }
resvg = { workspace = true }
tiny-skia = { workspace = true }
usvg = { workspace = true }
memchr = { workspace = true }
rayon = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
specta = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
trash = { workspace = true }
uuid = { workspace = true }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
lopdf = "=0.42.0"
html5gum = "=0.8.4"

[dev-dependencies]
serde_json = { workspace = true }
