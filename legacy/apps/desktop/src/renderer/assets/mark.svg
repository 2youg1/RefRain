<!--
  RefRain mark — B「起段」.

  Two colours only, and neither is baked in: the stroke inherits `currentColor`
  so the mark takes the theme's ink, and the seal reads `--role-pending` with a
  fallback. One file serves all nine themes, light and dark, because nothing in
  it is a literal colour.

  The barline is deliberately uneven — thick then thin, tight together. Two
  equal bars at this size read as a pause button; a real repeat sign is uneven,
  so copying the notation is what avoids the misread.

  viewBox is 48×48 with the mark on a 4px grid. At 16px use mark-16.svg, which
  drops the seal: tray icons render as templates and would strip the colour
  anyway, taking the one distinguishing element with it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48"
     fill="none" role="img" aria-label="RefRain">
  <g stroke="currentColor" stroke-width="1.6">
    <path d="M10 11v26" stroke-width="3.2"/>
    <path d="M13.6 11v26" stroke-width="1"/>
    <path d="M23 13l-3.5 13M31 13l-3.5 13M39 13l-3.5 13"/>
  </g>
  <path d="M18 33h23" stroke="var(--role-pending, #a8422f)" stroke-width="2"/>
</svg>
