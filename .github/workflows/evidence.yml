name: evidence

# Data-layer performance evidence, on each platform that RefRain states a
# budget for.
#
# It is not in `gate.yml` for two reasons. It costs a release build and a
# 100,000-file scan, which no pull request should wait for; and its verdict is a
# wall-clock reading, which a shared runner makes noisy. It is still allowed to
# go red: a scheduled lane that nobody can fail teaches nothing.
#
# The four stages here need only a release build and a disk, thus any runner can
# produce them. `verify:manuscript-scale` and `verify:open-latency` joined the
# lane late: both were on the pull-request path, both built the release profile
# there, and both judged a timing. Measured on one machine with one commit,
# `verify:open-latency` read 89.3 ms, then 80.5 ms, then 143.7 ms for the same
# manuscript, and `verify:large-input-performance` failed once and passed on the
# next run with nothing changed but the machine's load. A budget that moves by
# 60% between runs of the same bytes cannot block a pull request without
# teaching everyone to rerun the job.
#
# The correctness those two also carried stayed behind: `review.rs` and
# `open_probe` are still compiled and run in debug by the `rust` job's
# `cargo test --workspace --all-targets`. What moved is the reading.
#
# The lanes that need a GPU view (`evidence:pixels`) or a real window on the
# release platform (`evidence:window-performance`) are not here, because a
# shared runner cannot meet either requirement. Those run on the author's
# machine and their readings enter the release notes and ARCHITECTURE.md.

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/evidence.yml"
      - "crates/refrain-store/tests/project_performance.rs"
      - "crates/refrain-store/tests/large_input_performance.rs"
      - "crates/refrain-core/tests/review.rs"
      - "scripts/verify-open-latency.ts"
      - "scripts/verify-manuscript-scale.ts"
      - "scripts/gate.ts"

concurrency:
  group: evidence-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14
  RUST_VERSION: "1.97.1"
  ZIG_VERSION: "0.16.0"

jobs:
  data-performance:
    name: data-layer performance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # macOS is gone for the reason `gate.yml` records: RefRain publishes a
      # Windows artifact, no macOS build has ever succeeded, and a scheduled
      # lane reporting a colour about a platform nobody builds for is the
      # colour everybody learns to explain away.
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - run: bun install --frozen-lockfile

      # The corpora are generated, and `refrain-core` reads them with
      # `include_bytes!` at compile time, so cargo cannot start without them.
      - run: bun run corpora

      # A warm catalogue refresh reads the metadata of every file, and NTFS is
      # several times slower than ext4 at that work. One budget for both
      # platforms cannot be correct on either, so each platform states its own
      # and this matrix is what keeps the statement honest.
      - run: bun run evidence:data-performance
