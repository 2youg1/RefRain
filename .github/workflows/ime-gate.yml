name: native-ime

# The Windows IME acceptance lane, under construction (P7).
#
# It launches the shipping binary and reports the state it saw, and it does not
# yet reach its first composition. Until it does, it runs on request and once a
# week, not on every pull request that touches the surface: a lane that is red
# for a known reason on every change teaches people to ignore the colour, and
# the next real defect arrives in the same red.
#
# The macOS half was a job pinned to `[self-hosted, macOS, refrain-ime]`. No
# such runner is registered, thus the job never ran and never could. A gate that
# cannot run proves nothing; macOS IME is recorded in ARCHITECTURE.md as wired
# with no signature from a real machine, which is what is true.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ime-gate.yml"
      - "e2e/ime/**"

concurrency:
  group: native-ime-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14
  RUST_VERSION: "1.97.1"
  ZIG_VERSION: "0.16.0"

# The evidence policy test and the TypeScript check are not repeated here:
# `bun run gate` runs `bun test` and `bun run check:ts` on all three platforms,
# and this file's own job would be a second reader of the same two facts.
jobs:
  windows-native-ime:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Expose Zig's dlltool to Rust GNU target
        shell: pwsh
        run: |
          $shim = Join-Path $env:RUNNER_TEMP "refrain-zig-shims"
          New-Item -ItemType Directory -Force $shim | Out-Null
          foreach ($name in @("dlltool.cmd", "x86_64-w64-mingw32-dlltool.cmd")) {
            Set-Content -Path (Join-Path $shim $name) `
              -Value "@echo off`r`nzig dlltool %*" -Encoding Ascii
          }
          Add-Content -Path $env:GITHUB_PATH -Value $shim

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Match Cargo to the Native SDK Windows ABI
        run: rustup target add x86_64-pc-windows-gnu

      - run: bun install --frozen-lockfile

      # The Native SDK CLI transpiles through its own TypeScript toolchain
      # (`@typescript/old`), which bun installs under
      # `node_modules/.bun/<name>@<version>/node_modules` where node does not
      # look. Without this every `native` command fails with
      # "@typescript/old does not resolve". Resolved from the installed link so
      # no SDK version is written into the workflow.
      - name: Point node at the Native SDK's own dependencies
        shell: bash
        run: |
          sdk=$(node -e "console.log(require('fs').realpathSync('apps/native/node_modules/@native-sdk/cli'))")
          echo "NODE_PATH=$(dirname "$(dirname "$sdk")")" >> "$GITHUB_ENV"

      - name: Install Chinese and Japanese input methods
        shell: pwsh
        run: |
          foreach ($tag in @("zh-Hans-CN", "ja-JP")) {
            $languages = Get-WinUserLanguageList
            if (-not ($languages | Where-Object LanguageTag -eq $tag)) {
              Install-Language $tag
              $languages = Get-WinUserLanguageList
              $languages.Add($tag)
              Set-WinUserLanguageList $languages -Force
            }
          }

      # The IME target is the shipping binary, not a test harness. Composition
      # goes through the real Win32 IMM32 path, so a fixture would prove
      # nothing about what the author types.
      - name: Build the shipping Native executable with automation evidence
        working-directory: apps/native
        run: bun x native build . --yes -Dplatform=windows -Dautomation=true -Doptimize=ReleaseFast -Dtarget=x86_64-windows-gnu -Dcpu=x86_64_v2

      - name: Drive the Native GPU document surface with Microsoft Pinyin
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File e2e/ime/driver/drive-native-windows.ps1 `
            -Shell native `
            -Binary apps/native/zig-out/bin/refrain.exe

      # The driver already calls the assertion on its own exit path. Running it
      # again here is the independent check: it reads the recorded manifest
      # rather than the live window, so a driver that reported success without
      # writing evidence fails at this step.
      - name: Enforce Native IME acceptance from the recorded run
        run: bun e2e/ime/assert-native.ts --manifest e2e/ime/results/native/windows/run.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: native-ime-windows
          path: e2e/ime/results/native/windows/
          if-no-files-found: warn
          retention-days: 30
