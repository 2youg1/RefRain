name: windows-ime

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "e2e/ime/**"
      - "packages/editor/**"
      - "apps/desktop/src/**"
      - "apps/desktop/src-tauri/**"

concurrency:
  group: windows-ime-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14
  RUST_VERSION: "1.97.1"

jobs:
  ime:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Require the migrated IME harness
        shell: pwsh
        run: |
          $required = @(
            "e2e/ime/scripts/prepare.ps1",
            "e2e/ime/driver/drive.ps1",
            "e2e/ime/driver/assert.ts"
          )
          $missing = @($required | Where-Object { -not (Test-Path $_) })
          if ($missing.Count) { throw "Missing IME harness: $($missing -join ', ')" }

      - name: Install Chinese and Japanese input methods
        shell: pwsh
        run: |
          foreach ($tag in @("zh-Hans-CN", "ja-JP")) {
            $list = Get-WinUserLanguageList
            if (-not ($list | Where-Object LanguageTag -eq $tag)) {
              Install-Language $tag
              $list = Get-WinUserLanguageList
              $list.Add($tag)
              Set-WinUserLanguageList $list -Force
            }
          }

      - name: Build the Tauri shell
        working-directory: apps/desktop
        run: bun x tauri build --debug --no-bundle

      - name: Prepare the desktop
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File e2e/ime/scripts/prepare.ps1

      - name: Drive WebView2 with real input methods
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File e2e/ime/driver/drive.ps1 -Shell wv2

      - name: Assert IME acceptance
        run: bun e2e/ime/driver/assert.ts

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ime-results
          path: e2e/ime/results/
          if-no-files-found: warn
          retention-days: 30
