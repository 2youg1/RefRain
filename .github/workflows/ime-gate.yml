name: native-ime

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ime-gate.yml"
      - "apps/native/**"
      - "crates/refrain-app/**"
      - "crates/refrain-core/**"
      - "e2e/ime/**"
      - "patches/@native-sdk%2Fcli@0.8.1.patch"
      - "scripts/native-document-evidence-identity.ts"

concurrency:
  group: native-ime-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14
  RUST_VERSION: "1.97.1"
  ZIG_VERSION: "0.16.0"

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - run: bun install --frozen-lockfile
      - run: bun test e2e/ime/native-evidence-policy.test.ts
      - run: bun x tsc --noEmit -p tsconfig.json

  windows-native-ime:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Expose Zig's dlltool to Rust GNU target
        shell: pwsh
        run: |
          $shim = Join-Path $env:RUNNER_TEMP "refrain-zig-shims"
          New-Item -ItemType Directory -Force $shim | Out-Null
          foreach ($name in @("dlltool.cmd", "x86_64-w64-mingw32-dlltool.cmd")) {
            Set-Content -Path (Join-Path $shim $name) `
              -Value "@echo off`r`nzig dlltool %*" -Encoding Ascii
          }
          Add-Content -Path $env:GITHUB_PATH -Value $shim

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Match Cargo to the Native SDK Windows ABI
        run: rustup target add x86_64-pc-windows-gnu

      - run: bun install --frozen-lockfile

      - name: Install Chinese and Japanese input methods
        shell: pwsh
        run: |
          foreach ($tag in @("zh-Hans-CN", "ja-JP")) {
            $languages = Get-WinUserLanguageList
            if (-not ($languages | Where-Object LanguageTag -eq $tag)) {
              Install-Language $tag
              $languages = Get-WinUserLanguageList
              $languages.Add($tag)
              Set-WinUserLanguageList $languages -Force
            }
          }

      # The IME target is the shipping binary, not a test harness. Composition
      # goes through the real Win32 IMM32 path, so a fixture would prove
      # nothing about what the author types.
      - name: Build the shipping Native executable with automation evidence
        working-directory: apps/native
        run: bun x native build . --yes -Dplatform=windows -Dautomation=true -Doptimize=ReleaseFast

      - name: Drive the Native GPU document surface with Microsoft Pinyin
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File e2e/ime/driver/drive-native-windows.ps1 `
            -Shell native `
            -Binary apps/native/zig-out/bin/refrain.exe

      # The driver already calls the assertion on its own exit path. Running it
      # again here is the independent check: it reads the recorded manifest
      # rather than the live window, so a driver that reported success without
      # writing evidence fails at this step.
      - name: Enforce Native IME acceptance from the recorded run
        run: bun e2e/ime/assert-native.ts --manifest e2e/ime/results/native/windows/run.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: native-ime-windows
          path: e2e/ime/results/native/windows/
          if-no-files-found: warn
          retention-days: 30

  macos-native-ime:
    runs-on: [self-hosted, macOS, refrain-ime]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Require the configured Japanese input source and UI control permission
        run: |
          defaults read com.apple.HIToolbox AppleEnabledInputSources
          osascript -e 'tell application "System Events" to get UI elements enabled'

      - name: Build the shipping Native executable with automation evidence
        working-directory: apps/native
        run: bun x native build . --yes -Dplatform=macos -Dautomation=true -Doptimize=ReleaseFast

      - name: Drive the Native GPU document surface with Kotoeri
        run: bun e2e/ime/driver/drive-native-macos.ts

      - name: Enforce Native IME acceptance from the recorded run
        run: bun e2e/ime/assert-native.ts --manifest e2e/ime/results/native/macos/run.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: native-ime-macos
          path: e2e/ime/results/native/macos/
          if-no-files-found: warn
          retention-days: 30
