name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.14
  RUST_VERSION: "1.97.1"

jobs:
  build:
    name: ${{ matrix.target }}
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-latest
            node_platform: win32
            arch: x64
            builder_args: --win --x64
            assets: apps/desktop/release/*.exe

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/fs

      - run: bun install --frozen-lockfile

      # A release rebuilds and tests the native layer on the platform that will
      # load it. A binary copied from another job would only prove that bytes
      # travelled, not that this runner can execute them.
      - name: Test the native file layer
        working-directory: packages/fs
        run: cargo test --lib

      - name: Build the platform binary
        run: bun run native

      - name: Require the binary under Node's platform name
        shell: bash
        run: test -s "packages/fs/refrain-fs.${{ matrix.node_platform }}-${{ matrix.arch }}.node"

      # The TypeScript contracts also run on every release platform. This is
      # where path and process assumptions that Linux permits are refused.
      - run: bun run fmt:check
      - run: bun run check
      - run: bun test

      # The invariants are checked on the platform being shipped, not only on
      # the Linux gate. Source fidelity is the one that most needs it: CRLF is
      # a Windows fact, and a line-ending rule that holds on Linux proves
      # nothing about the machine this installer is built for.
      - name: Bytes the author did not edit come back unchanged
        run: bun run verify:roundtrip

      - name: Saving a long manuscript costs what the change costs
        run: bun run verify:scale

      - name: No outbound request reaches the application process
        run: bun run verify:no-network

      - name: Delete goes to the trash, everywhere
        run: bun run verify:trash-only

      - name: Every gate has a path that runs it
        run: bun run verify:gates-run

      - name: Build renderer, main, and preload
        working-directory: apps/desktop
        shell: bash
        run: ./make.sh

      # A release must not ship a main process that names a Bun global: it is
      # bundled for Node, so the reference is a crash on the user's machine
      # that no test under Bun can reach.
      - name: The main process names no Bun global
        working-directory: apps/desktop
        run: bun scripts/verify-no-bun.ts

      - name: Build-shape checks
        working-directory: apps/desktop
        run: bun test test/smoke.test.ts

      - name: Install a browser for the rendering checks
        run: bun x playwright install chromium --only-shell

      # Composition and the author's whitespace, checked against the bundle
      # that is about to be packaged rather than against source.
      - name: Composition defers the save, and the indent is visible
        working-directory: apps/desktop
        run: bun scripts/verify-composition.ts

      # Windows is the first supported desktop and the only hosted runner on
      # which this project has a real window launch check. The IME workflow is
      # separate because it seizes a desktop and types through MS Pinyin.
      - name: Launch the app and require a loaded window
        if: matrix.target == 'windows-x64'
        working-directory: apps/desktop
        timeout-minutes: 4
        run: node scripts/launch-check.mjs

      - name: Package ${{ matrix.target }}
        working-directory: apps/desktop
        shell: bash
        run: bun x electron-builder ${{ matrix.builder_args }} --publish never

      - uses: actions/upload-artifact@v7
        with:
          name: refrain-${{ matrix.target }}
          path: ${{ matrix.assets }}
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: refrain-*
          path: release-assets
          merge-multiple: true

      - name: List the files that will be published
        run: |
          python3 - <<'PY'
          from pathlib import Path
          assets = sorted(p for p in Path("release-assets").iterdir() if p.is_file())
          if len(assets) != 1:
              raise SystemExit(f"expected 1 release file, found {len(assets)}")
          for path in assets:
              print(f"{path.name}  {path.stat().st_size} bytes")
          PY

      # One job owns the Release. The build job uploads one verified Windows
      # installer; this job alone turns it into a public release asset.
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          body: |
            RefRain 0.1.5 is available for **Windows x64**.

            This release is about the manuscript surviving contact with the
            application.

            **Bytes you did not write stay as you left them.** Opening a file
            and saving it with no edit at all used to lose bytes: the
            ideographic indent that opens a Chinese paragraph was deleted on
            load, a fenced code block was cut in two by the blank line inside
            it, and consecutive blank lines collapsed. Twelve bytes of a
            hundred and eighty-six, with the whole test suite green. A file now
            parses into blocks that remember where they sit in the original,
            and saving replaces only the ranges whose text actually changed.

            **Typing Chinese waits for the input method.** Ctrl+S mid-word
            wrote half-formed pinyin to disk as prose, and a redraw arriving
            during composition tore out the node the input method was composing
            into. A save asked for mid-composition is now deferred, not
            refused. The surface also stopped collapsing whitespace, so an
            indent is visible as an indent.

            **Saving a long book costs what the change costs.** A
            40,000-paragraph manuscript threw `RangeError: Out of memory` on
            any save. Correcting one character in a 20,000-paragraph manuscript
            took 5.2 seconds; it now takes 5.5 milliseconds, and 100,000
            paragraphs complete in every shape of edit that used to crash.

            Open or drop a folder of Markdown files. **Ctrl K** reaches every
            command; **Ctrl Enter** enters Zen.

            The application makes no network requests, has no accounts, and
            never merges agent output without a human click. Token counts show
            exactly what a harness reports, and unknown when it reports nothing.

            The Windows IME gate (`e2e/ime`, Microsoft Pinyin through real
            `SendInput`) has not been run against this build: it needs a real
            desktop with an input method installed, which no hosted runner
            provides. The composition fix above is checked by a headless gate
            driving real `CompositionEvent`s, which is weaker evidence and is
            not claimed as more.

            This is an unsigned preview release. Windows SmartScreen may
            therefore ask for an explicit confirmation.
