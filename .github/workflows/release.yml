name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14
  RUST_VERSION: "1.97.1"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - run: bun install --frozen-lockfile
      - run: bun run gate
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets

      - name: Generated bindings are current
        run: |
          bun run generate
          git diff --exit-code -- apps/desktop/src/generated

      - name: Match the tag to the package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $package = $metadata.packages | Where-Object name -eq "refrain-desktop"
          if ("v$($package.version)" -ne "$env:GITHUB_REF_NAME") {
            throw "Tag $env:GITHUB_REF_NAME does not match v$($package.version)"
          }

      - name: Build the NSIS installer
        working-directory: apps/desktop
        run: bun x tauri build --bundles nsis

      - name: Select one installer
        shell: pwsh
        run: |
          $files = @(Get-ChildItem "target/release/bundle/nsis/*.exe" -File)
          if ($files.Count -ne 1) { throw "Expected one NSIS installer, found $($files.Count)" }
          New-Item -ItemType Directory -Force "release-assets" | Out-Null
          Copy-Item $files[0].FullName "release-assets/refrain-windows-x64-setup.exe"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: refrain-windows-x64
          path: release-assets/refrain-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: refrain-windows-x64
          path: release-assets

      - name: Build the release SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: release-assets
          format: spdx-json
          output-file: release-assets/refrain-windows-x64.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Hash and read back every asset
        working-directory: release-assets
        run: |
          sha256sum -- *.exe *.json > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            release-assets/*.exe \
            release-assets/*.json \
            release-assets/SHA256SUMS
