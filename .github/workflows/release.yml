name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build and publish, without the leading v
        required: true
        default: 0.1.0

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # The three gates run here too: a release must not ship code that would
      # have been refused on a pull request.
      - run: bun run fmt:check
      - run: bun run check
      - run: bun test

      - name: Build renderer, main, and preload
        working-directory: apps/desktop
        shell: bash
        run: ./make.sh

      - name: Build-shape checks
        working-directory: apps/desktop
        run: bun test test/smoke.test.ts

      # The decisive check. Files on disk prove nothing; this launches the real
      # Electron binary on a real Windows desktop and requires the window to
      # report that it finished loading.
      - name: Launch the app and require a loaded window
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $output = & ./node_modules/.bin/electron.cmd dist/main/main.cjs --smoke 2>&1 | Out-String
          Write-Host $output
          if ($output -notmatch 'SMOKE_OK') { throw 'the window never finished loading' }

      - name: Package the Windows installer
        working-directory: apps/desktop
        shell: bash
        run: ./node_modules/.bin/electron-builder --win --publish never

      - name: Verify the installer exists and is not a stub
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $exe = Get-ChildItem release/*.exe | Select-Object -First 1
          if (-not $exe) { throw 'electron-builder produced no installer' }
          Write-Host "$($exe.Name)  $([math]::Round($exe.Length / 1MB, 1)) MB"
          if ($exe.Length -lt 40MB) { throw 'installer is implausibly small' }

      - uses: actions/upload-artifact@v7
        with:
          name: recension-windows-installer
          path: apps/desktop/release/*.exe
          retention-days: 30

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/release/*.exe
          generate_release_notes: true
          body: |
            **First runnable build. Windows x64.**

            Download the installer below, run it, and open a folder of Markdown
            files as a project.

            What works: writing, selecting a range and queuing a task, the send
            manifest, the file channel to any agent, freezing a result into
            proposals, judging slice by slice with a stated reason, committing a
            decision batch, and the ledger.

            The application makes no network requests, has no accounts, and
            never merges anything without a click. Token counts display exactly
            what a harness reports, and unknown when it reports nothing.

            Please report anything that breaks — this build wants real use.
