name: release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14
  NODE_VERSION: "24"
  RUST_VERSION: "1.97.1"
  SCRIPTC_VERSION: "0.0.21"
  ZIG_VERSION: "0.16.0"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    # Compile through `zig cc`, not the runner's LLVM clang.
    #
    # The ScriptC runtime declares its transport ops with `ssize_t` and states
    # it targets the mingw-w64 CRT. The runner's clang defaults to MSVC mode,
    # whose <sys/types.h> has no such type, so every ScriptC build on Windows
    # failed at scr_runtime.h with "type name requires a specifier or
    # qualifier". zig ships the mingw headers, and ScriptC supports this
    # driver natively (SCRIPTC_CC=zigcc, see @scriptc/compiler resolveCc).
    #
    # This is the step that makes the compiled artefact authoritative on
    # Windows. Before it, the failure was swallowed by continue-on-error and
    # the release fell back to Bun — the fallback D15 forbids.
    env:
      SCRIPTC_CC: zigcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The Native SDK drives its own Zig. Pinning it here keeps the shipped
      # binary reproducible: an unpinned compiler changes the bytes we hash.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - run: bun install --frozen-lockfile

      - name: Install ScriptC
        run: |
          bun install --global scriptc@${{ env.SCRIPTC_VERSION }}
          scriptc --version
          zig version

      # The version gate is ScriptC-owned. Running it through Bun here would
      # mean the compiled artefact was never the authority (D15), so the gate
      # is compiled first and only the executable runs.
      - name: Check every version surface with the compiled gate
        shell: pwsh
        run: |
          scriptc build scripts/verify-release-version.ts `
            -o target/scriptc/verify-release-version.exe --no-keep-c
          & target/scriptc/verify-release-version.exe
          if ($LASTEXITCODE -ne 0) { throw "release version gate failed" }

      - name: Match the tag to the application version
        shell: pwsh
        run: |
          $manifest = Get-Content apps/native/app.zon -Raw
          if ($manifest -notmatch '\.version\s*=\s*"([^"]+)"') {
            throw "apps/native/app.zon does not declare a version"
          }
          $version = $Matches[1]
          if ("v$version" -ne "$env:GITHUB_REF_NAME") {
            throw "Tag $env:GITHUB_REF_NAME does not match v$version"
          }

      - name: Build the Native Windows binary
        working-directory: apps/native
        run: bun x native build . --yes -Dplatform=windows -Doptimize=ReleaseFast

      # `native package` produces the application directory. It does not produce
      # the public asset: ScriptC owns the archive so the bytes are ours and
      # deterministic. `--web-layer exclude` proves no WebView path survives.
      - name: Obtain the Native application directory
        working-directory: apps/native
        run: |
          bun x native package --target windows `
            --output ../../target/native/refrain-windows-x64 `
            --web-layer exclude `
            --signing none

      - name: Measure the release program before trusting it
        shell: pwsh
        run: |
          $coverage = scriptc coverage scripts/release-assets.ts | Out-String
          Write-Output $coverage
          if ($coverage -notmatch 'fully static') {
            throw "release-assets.ts has a ScriptC dynamic remainder"
          }
          scriptc build scripts/release-assets.ts `
            -o target/scriptc/release-assets.exe --no-keep-c

      # Build the archive twice from the same input. Equal hashes are the
      # evidence that the packager is deterministic; a timestamp or a directory
      # iteration order leaking into the bytes shows up here and nowhere else.
      - name: Build the portable archive twice and compare the bytes
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          & target/scriptc/release-assets.exe package `
            $version target/native/refrain-windows-x64 release-assets
          if ($LASTEXITCODE -ne 0) { throw "release packaging failed" }
          & target/scriptc/release-assets.exe package `
            $version target/native/refrain-windows-x64 release-assets-repeat
          if ($LASTEXITCODE -ne 0) { throw "repeat packaging failed" }
          $first = (Get-FileHash -Algorithm SHA256 release-assets/refrain-windows-x64.zip).Hash
          $second = (Get-FileHash -Algorithm SHA256 release-assets-repeat/refrain-windows-x64.zip).Hash
          if ($first -ne $second) { throw "packaging is not deterministic: $first vs $second" }
          Remove-Item -Recurse -Force release-assets-repeat

      # Two independent readers. The release program knows what it wrote, so it
      # cannot catch a format error it also emits; Windows' own extractor can.
      - name: Read the archive back with two independent extractors
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          & target/scriptc/release-assets.exe verify release-assets/refrain-windows-x64.zip $version
          if ($LASTEXITCODE -ne 0) { throw "release program could not read its own archive" }
          Expand-Archive -LiteralPath release-assets/refrain-windows-x64.zip `
            -DestinationPath target/readback -Force
          if (-not (Test-Path target/readback/RefRain)) {
            throw "the archive does not contain the RefRain product root"
          }

      - name: Publish exactly one asset from this job
        shell: pwsh
        run: |
          $files = Get-ChildItem release-assets -File
          if ($files.Count -ne 1) { throw "expected one asset, found $($files.Count)" }
          if ($files[0].Name -ne "refrain-windows-x64.zip") {
            throw "unexpected asset $($files[0].Name)"
          }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: refrain-windows-x64
          path: release-assets/refrain-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: refrain-windows-x64
          path: release-assets

      - name: Require exactly one downloaded asset
        run: |
          test -s release-assets/refrain-windows-x64.zip
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 1

      # A third extractor on a third operating system. The manifest, the
      # CycloneDX SBOM and SHA256SUMS are inside the archive, so the asset is
      # self-describing: whoever downloads it can check it without this
      # workflow, and without trusting us.
      - name: Verify the archive with a standard extractor
        run: |
          python3 -m zipfile -t release-assets/refrain-windows-x64.zip
          python3 -m zipfile -e release-assets/refrain-windows-x64.zip target/readback
          cd target/readback
          test -s release-manifest.json
          test -s refrain-windows-x64.cdx.json
          sha256sum --check SHA256SUMS

      - name: Publish the verified portable asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(cat <<EOF
          > **⚠️ 项目未完成，仅用于作者测试，请勿下载。**
          > **⚠️ This project is unfinished and provided for the author's testing only. Do not download.**

          ---

          ## Documentation

          - [README](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/README.md)
          - [Agent rules](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/AGENTS.md)
          - [Architecture](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/ARCHITECTURE.md)
          - [Contributing](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/CONTRIBUTING.md)
          - [Roadmap](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/ROADMAP.md)
          - [Agent protocol](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/SKILL.md)
          - [MPL 2.0 license](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/LICENSE)

          The portable ZIP carries release-manifest.json, the CycloneDX SBOM and
          SHA256SUMS. Extract it and run \`sha256sum --check SHA256SUMS\` to verify
          every file without trusting this workflow.
          EOF
          )
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --notes "$notes" \
            release-assets/refrain-windows-x64.zip
