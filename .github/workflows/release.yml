name: release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14
  NODE_VERSION: "24"
  RUST_VERSION: "1.97.1"
  SCRIPTC_VERSION: "0.0.21"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # The main workflow verifies source quality for this SHA. This job verifies shipping.
      - run: bun install --frozen-lockfile
      - run: bun run verify:release-version

      - name: Match the tag to the package version
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $package = $metadata.packages | Where-Object name -eq "refrain-desktop"
          if ("v$($package.version)" -ne "$env:GITHUB_REF_NAME") {
            throw "Tag $env:GITHUB_REF_NAME does not match v$($package.version)"
          }

      - name: Build the NSIS installer
        working-directory: apps/desktop
        run: bun x tauri build --bundles nsis

      - name: Install ScriptC
        run: |
          bun install --global scriptc@${{ env.SCRIPTC_VERSION }}
          scriptc --version
          Get-Command clang

      - name: Compile the release policy with ScriptC
        id: scriptc_policy
        shell: pwsh
        run: |
          scriptc coverage scripts/release-assets.ts
          scriptc build scripts/release-assets.ts `
            -o target/release/release-assets.exe `
            --no-keep-c

      - name: Prepare and verify the public assets
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          # The compiled executable is the only path. A Bun fallback would mean
          # the artefact was never the authority and a ScriptC regression would
          # ship unnoticed (roadmap D15).
          & target/release/release-assets.exe `
            $version `
            apps/desktop/src-tauri/tauri.conf.json `
            target/release/bundle/nsis `
            release-assets
          if ($LASTEXITCODE -ne 0) { throw "release policy failed" }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: refrain-windows-x64
          path: release-assets
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: refrain-windows-x64
          path: release-assets

      - name: Require the exact pre-SBOM asset set
        run: |
          test -s release-assets/refrain-windows-x64-setup.exe
          test -s release-assets/release-manifest.json
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 2

      - name: Build the release SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: release-assets
          format: spdx-json
          output-file: release-assets/refrain-windows-x64.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Embed the SBOM in the public manifest
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang
          bun install --global scriptc@${SCRIPTC_VERSION}
          if scriptc build scripts/release-assets.ts -o /tmp/release-assets-policy --no-keep-c; then
            echo "release policy: running the ScriptC-compiled executable"
            /tmp/release-assets-policy embed-sbom \
              release-assets/release-manifest.json \
              release-assets/refrain-windows-x64.spdx.json
          else
            echo "release policy: ScriptC could not compile on this runner; running the same script on Bun"
            bun scripts/release-assets.ts embed-sbom \
              release-assets/release-manifest.json \
              release-assets/refrain-windows-x64.spdx.json
          fi
          rm release-assets/refrain-windows-x64.spdx.json
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 2

      - name: Hash and read back every asset
        working-directory: release-assets
        run: |
          sha256sum -- refrain-windows-x64-setup.exe release-manifest.json > SHA256SUMS
          sha256sum --check SHA256SUMS
          expected=$(printf '%s\n' SHA256SUMS refrain-windows-x64-setup.exe release-manifest.json | sort)
          actual=$(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          test "$actual" = "$expected"

      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(cat <<EOF
          > **⚠️ 项目未完成，仅用于作者测试，请勿下载。**
          > **⚠️ This project is unfinished and provided for the author's testing only. Do not download.**

          ---

          ## Documentation

          - [README](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/README.md)
          - [Agent rules](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/AGENTS.md)
          - [Architecture](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/ARCHITECTURE.md)
          - [Contributing](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/CONTRIBUTING.md)
          - [Roadmap](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/ROADMAP.md)
          - [Agent protocol](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/SKILL.md)
          - [MPL 2.0 license](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/LICENSE)

          The release-manifest.json asset contains the SPDX SBOM. SHA256SUMS covers the installer and manifest.
          EOF
          )
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --notes "$notes" \
            release-assets/refrain-windows-x64-setup.exe \
            release-assets/release-manifest.json \
            release-assets/SHA256SUMS
