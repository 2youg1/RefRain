name: release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14
  RUST_VERSION: "1.97.1"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # The main-branch gate owns formatting, tests, source gates and real-window
      # E2E. Repeating them here made a tag publication depend on unrelated
      # Chromium timing a second time. The release job owns only the shipping
      # path: immutable versions, a native Windows build, exact assets and hashes.
      - run: bun install --frozen-lockfile
      - run: bun run verify:release-version

      - name: Match the tag to the package version
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $package = $metadata.packages | Where-Object name -eq "refrain-desktop"
          if ("v$($package.version)" -ne "$env:GITHUB_REF_NAME") {
            throw "Tag $env:GITHUB_REF_NAME does not match v$($package.version)"
          }

      - name: Build the NSIS installer
        working-directory: apps/desktop
        run: bun x tauri build --bundles nsis

      - name: Install ScriptC
        run: |
          npm install --global scriptc@0.0.17
          scriptc --version

      - name: Compile the release policy with ScriptC
        shell: pwsh
        run: |
          scriptc coverage scripts/release-assets.ts
          scriptc build scripts/release-assets.ts `
            -o target/release/release-assets.exe `
            --no-keep-c

      - name: Prepare and verify the public assets
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          & target/release/release-assets.exe `
            $version `
            apps/desktop/src-tauri/tauri.conf.json `
            target/release/bundle/nsis `
            release-assets
          if ($LASTEXITCODE -ne 0) { throw "ScriptC release policy failed" }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: refrain-windows-x64
          path: release-assets
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: refrain-windows-x64
          path: release-assets

      - name: Require the exact pre-SBOM asset set
        run: |
          test -s release-assets/refrain-windows-x64-setup.exe
          test -s release-assets/release-manifest.json
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 2

      - name: Build the release SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: release-assets
          format: spdx-json
          output-file: release-assets/refrain-windows-x64.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Hash and read back every asset
        working-directory: release-assets
        run: |
          sha256sum -- *.exe *.json > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            release-assets/*.exe \
            release-assets/*.json \
            release-assets/SHA256SUMS
