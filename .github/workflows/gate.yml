name: gate

# Three jobs, split by what a verdict depends on rather than by which language
# produced it. Each stage in `scripts/gate.ts` declares one requirement, and
# each job here runs exactly the stages that name its own — so a job installs
# what it needs and nothing else, and a red job says which capability broke.
#
# Before this there was one `quality` job with a 45 minute budget doing every
# step in sequence on both platforms: toolchains, ScriptC, the whole gate, the
# bite proof, fmt, clippy, test, the Zig build and the journals. Whatever failed,
# the fix cost a rerun of all of it, and the two heaviest stages on that path
# were wall-clock budgets that a shared runner cannot judge. Those stages now
# live in `evidence.yml`.
#
# `source` installs no Rust and no Zig, so it starts returning verdicts while
# the other two are still fetching toolchains: 32 stages, 17 seconds measured
# on the author's machine.
#
# A fourth requirement, `artifact`, has no job of its own: it needs the built
# product binary, so it runs as a second gate step inside `native`, after
# `native build` and on the platform that ships. Splitting it out of `native`
# is what lets the rest of that job keep starting before anything is linked.

on:
  push:
    branches: [main, v0.2-rebuild]
  pull_request:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# No ScriptC version is declared here. The compiler that builds the tier A
# gates is the one `bun.lock` resolved for the Native SDK, and
# `scripts/scriptc-compiler.ts` resolves it. A version in this file would be a
# second authority for that fact, which is exactly the split this workflow used
# to carry: it installed 0.0.21 globally while the lockfile pinned 0.0.35, so
# every tier A verdict described a compiler no file in the repository named.
env:
  BUN_VERSION: 1.3.14
  RUST_VERSION: "1.97.1"
  ZIG_VERSION: "0.16.0"

jobs:
  # ---------------------------------------------------------------- source ---
  # Reads the repository and compiles nothing but ScriptC. One platform is
  # enough: every stage here is a deterministic scan of committed bytes, so a
  # second runner would answer the same question twice.
  source:
    name: source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SCRIPTC_CC: zigcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # ScriptC compiles C, and one C driver on every platform keeps the
      # artefacts comparable. zig is here for that alone; no Zig code is built
      # in this job.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - run: bun install --frozen-lockfile

      # Tier A gates run as compiled executables with no Bun fallback (D15), so
      # the gate cannot start until they exist. This step also prints the
      # resolved compiler version, which is what the deleted global install and
      # its `scriptc --version` used to report.
      - run: bun run scriptc:build

      - uses: ./.github/actions/run-gate
        with:
          needs: files
          label: source

      # Injection proof for every source gate: break what each one guards,
      # require the specific red, restore, require green. It reads only files,
      # thus it belongs beside the stages it proves.
      - name: Prove every source gate can fail
        run: bun scripts/prove-gates-bite.ts

  # ------------------------------------------------------------------ rust ---
  # Debug profile only. The release profile left this path with the wall-clock
  # budgets that needed it: a second full compile of rusqlite, resvg and image
  # for a timing a shared runner cannot judge. One profile also means the cache
  # holds one profile, instead of debug and release evicting each other.
  #
  # No GTK here. `Cargo.lock` carries no gtk, glib or gdk crate — rfd reaches
  # the desktop through xdg-portal and trash through zbus — so the window
  # libraries belong to the Zig build in `native`, not to cargo.
  rust:
    name: rust (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # One of this job's four stages, `verify:skill-doc-current`, is tier A, so
    # this job compiles ScriptC and needs a C driver for it — the same one
    # `source` uses, because artefacts built by two compilers are not comparable.
    env:
      SCRIPTC_CC: zigcc
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Zig serves two unrelated purposes here, and no Zig code is built in this
      # job. It is the C driver ScriptC compiles the tier A gates with, on both
      # rows; and on Windows it also supplies the dlltool that Rust's
      # x86_64-pc-windows-gnu target needs. The Windows row had it for the
      # second reason alone, which is why the Linux row went without one.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Expose Zig's dlltool to Rust GNU target
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $shim = Join-Path $env:RUNNER_TEMP "refrain-zig-shims"
          New-Item -ItemType Directory -Force $shim | Out-Null
          foreach ($name in @("dlltool.cmd", "x86_64-w64-mingw32-dlltool.cmd")) {
            Set-Content -Path (Join-Path $shim $name) `
              -Value "@echo off`r`nzig dlltool %*" -Encoding Ascii
          }
          Add-Content -Path $env:GITHUB_PATH -Value $shim

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Match Cargo to the Native SDK Windows ABI
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-gnu

      # A key of its own. Sharing one cache with the release artefacts of the
      # `native` job is what made both jobs slow: each run evicted the other's
      # profile and recompiled the dependency tree from source.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: rust-debug

      - run: bun install --frozen-lockfile

      # The roundtrip corpora are generated and are not committed, and
      # `crates/refrain-core/tests/source_layout.rs` reads them with
      # `include_bytes!` at compile time. Without this, cargo exits 101 before
      # one test runs. The full gate would also generate them; this job needs
      # only that one stage.
      - run: bun run corpora

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets

      # `verify:skill-doc-current` is tier A: `gate.ts` runs it as the compiled
      # executable and fails closed when that file is absent, with no fallback
      # to Bun (D15). This job never built one, so it reported
      # "tier A executable missing" on every run since the split — a red about
      # this workflow rather than about the commit under test.
      - run: bun run scriptc:build

      # Four gates that read what cargo produces. They run after the workspace
      # is built, thus they reuse the artefacts above rather than paying for
      # their own.
      - uses: ./.github/actions/run-gate
        with:
          needs: cargo
          label: rust-${{ matrix.platform }}

  # ---------------------------------------------------------------- native ---
  # The Native SDK toolchain: Zig, and cargo, because `apps/native/build.zig`
  # runs `cargo build -p refrain-native-host --release` and links the staticlib
  # into both the executable and the test module.
  native:
    name: native (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # `build_flags` carries the CPU pin, and only the release platform
          # gets one. Naming a target makes Zig's query non-native, which on
          # Linux also turns off the system-library search the GTK/X11 link
          # needs; Windows links no system libraries that way, and it is the
          # only platform that ships, so it is the only one that must match the
          # instruction set the release is built for.
          - platform: linux
            os: ubuntu-latest
            binary: zig-out/bin/refrain
            build_flags: ""
          - platform: windows
            os: windows-latest
            binary: zig-out/bin/refrain.exe
            build_flags: "-Dtarget=x86_64-windows-gnu -Dcpu=x86_64_v2"
          # macOS is not a target. RefRain publishes a Windows artifact, and no
          # macOS build has ever succeeded, so the row gated every release on a
          # platform nobody builds for: `release.yml` requires a successful gate
          # run on the tagged commit, one job red makes the run red, and v0.3.0
          # and v0.3.1 were tagged and never published for that reason.
          #
          # The macOS support in `build.zig` and in the IME lane stays where it
          # is, untouched and unclaimed. It gets judged when there is a machine
          # to judge it on; a green row bought by guessing at another platform's
          # linker is not evidence, and this gate's whole defect was colour
          # without evidence behind it.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # The Native SDK compiles the product surface. An unpinned Zig changes
      # the binary under us, so the version is declared once and used by all
      # three workflows.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Expose Zig's dlltool to Rust GNU target
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $shim = Join-Path $env:RUNNER_TEMP "refrain-zig-shims"
          New-Item -ItemType Directory -Force $shim | Out-Null
          foreach ($name in @("dlltool.cmd", "x86_64-w64-mingw32-dlltool.cmd")) {
            Set-Content -Path (Join-Path $shim $name) `
              -Value "@echo off`r`nzig dlltool %*" -Encoding Ascii
          }
          Add-Content -Path $env:GITHUB_PATH -Value $shim

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Match Cargo to the Native SDK Windows ABI
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-gnu

      # The release profile, kept apart from the debug cache in `rust`.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: rust-release

      # GTK4 is the Linux window host for the Native SDK. This is the whole
      # platform dependency list now: no embedded browser, no app indicator,
      # no SVG rasteriser.
      - name: Install the Linux window libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-4-dev

      - run: bun install --frozen-lockfile

      # Every `native` command needs this, and its absence is why this gate had
      # never been green on a runner. The Native SDK CLI transpiles the core
      # through its own TypeScript toolchain (`@typescript/old`). Bun installs
      # a package's own dependencies under
      # `node_modules/.bun/<name>@<version>/node_modules`, which node does not
      # search, so `native test` and `native build` both died with
      # "@typescript/old does not resolve" while every source gate passed. The
      # author's machine exports the same variable by hand, so the difference
      # between the two never showed until the gate could say why it failed.
      #
      # Resolve it from the installed link instead of writing the version in:
      # the realpath of the CLI is `<store>/node_modules/@native-sdk/cli`, so
      # two levels up is the directory that holds its dependencies.
      - name: Point node at the Native SDK's own dependencies
        shell: bash
        run: |
          sdk=$(node -e "console.log(require('fs').realpathSync('apps/native/node_modules/@native-sdk/cli'))")
          echo "NODE_PATH=$(dirname "$(dirname "$sdk")")" >> "$GITHUB_ENV"

      - run: bun run corpora

      - uses: ./.github/actions/run-gate
        with:
          needs: native
          label: native-${{ matrix.platform }}

      # The cross-boundary protocol is generated from one schema. Drift here is
      # a silently rejected request at runtime, so it is checked, not trusted.
      - name: Generated protocol is current
        if: runner.os == 'Linux'
        run: |
          bun scripts/generate-native-protocol.ts --check
          bun scripts/generate-themes.ts --check
          git diff --exit-code -- apps/native/src/generated

      # The Windows row builds for the same named CPU floor the release does,
      # so the journals below replay the instruction set that ships. Without a
      # pin the SDK's `b.standardTargetOptions(.{})` resolves to the build
      # machine's own features: v0.3.3 was built on an AMD runner, picked up
      # `INSERTQ` (SSE4a, AMD only), and died with 0xC000001D on the author's
      # Intel laptop while every gate stayed green — a machine can always run
      # what it just compiled for itself.
      - name: Build the Native platform binary
        working-directory: apps/native
        run: bun x native build . --yes -Dplatform=${{ matrix.platform }} ${{ matrix.build_flags }}

      # The `artifact` requirement: one gate that reads the linked object rather
      # than any source of it. It cannot sit in the gate step above, which runs
      # before anything is linked, and it reads a PE import table, so it runs on
      # the platform that ships and nowhere else.
      - uses: ./.github/actions/run-gate
        if: runner.os == 'Windows'
        with:
          needs: artifact
          label: artifact-${{ matrix.platform }}

      # Eight journals, one per destination, recorded on a real window by
      # `bun run e2e:record` and replayed here headlessly (null platform: the
      # journal is the world). Three of them also verify every frame's
      # accessibility fingerprint; the five that open a manuscript cannot until
      # M8 closes. This replaces the embedded-browser drivers entirely: there is
      # no browser in the product, so there is no browser in the gate.
      #
      # The replay first compares the protocol version each journal was recorded
      # under with the one compiled into this binary. Without that comparison a
      # protocol change leaves every host answer refused and every fingerprint
      # still agreeing, and the lane reports green while it judges nothing.
      - name: Every destination replays from its journal
        if: runner.os == 'Windows'
        run: bun run e2e:journals

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && runner.os == 'Windows'
        with:
          name: refrain-windows-e2e-evidence
          path: target/e2e-evidence
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: runner.os == 'Windows'
        with:
          name: refrain-windows-debug
          path: apps/native/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 3

  # Evidence does not live here. Each evidence lane names one thing it needs
  # from the machine, and a shared runner meets none of them: the pixel lane
  # needs a GPU view, the window lane needs a real window on the release
  # platform, and a wall-clock budget measured on a shared runner is a reading
  # about the runner. They run from `evidence.yml` and from the author's
  # machine. A lane that runs where its requirement is absent produces a colour
  # that everybody learns to explain away.
