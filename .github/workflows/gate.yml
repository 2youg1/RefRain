name: gate

on:
  push:
    branches: [main, v0.2-rebuild]
  pull_request:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14
  SCRIPTC_VERSION: "0.0.21"
  RUST_VERSION: "1.97.1"
  ZIG_VERSION: "0.16.0"

jobs:
  quality:
    name: quality (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # One C driver on every platform. The runner's own clang differs per OS —
    # on Windows it defaults to MSVC mode, whose <sys/types.h> lacks the
    # `ssize_t` the ScriptC runtime declares its transport ops with, so every
    # Windows ScriptC build failed inside scr_runtime.h. zig ships the mingw
    # headers and is already required by this job, and ScriptC supports the
    # driver natively (SCRIPTC_CC=zigcc).
    env:
      SCRIPTC_CC: zigcc
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            binary: zig-out/bin/refrain
          - platform: windows
            os: windows-latest
            binary: zig-out/bin/refrain.exe
          - platform: macos
            os: macos-latest
            binary: zig-out/bin/refrain

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # The Native SDK compiles the product surface. An unpinned Zig changes
      # the binary under us, so the version is declared once and used by all
      # three workflows.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Expose Zig's dlltool to Rust GNU target
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $shim = Join-Path $env:RUNNER_TEMP "refrain-zig-shims"
          New-Item -ItemType Directory -Force $shim | Out-Null
          foreach ($name in @("dlltool.cmd", "x86_64-w64-mingw32-dlltool.cmd")) {
            Set-Content -Path (Join-Path $shim $name) `
              -Value "@echo off`r`nzig dlltool %*" -Encoding Ascii
          }
          Add-Content -Path $env:GITHUB_PATH -Value $shim

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Match Cargo to the Native SDK Windows ABI
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # GTK4 is the Linux window host for the Native SDK. This is the whole
      # platform dependency list now: no embedded browser, no app indicator,
      # no SVG rasteriser.
      - name: Install the Linux window libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-4-dev

      - run: bun install --frozen-lockfile

      # Tier A gates run as compiled executables with no Bun fallback (D15),
      # so the gate cannot start until they exist.
      - name: Install ScriptC
        run: |
          bun install --global scriptc@${{ env.SCRIPTC_VERSION }}
          scriptc --version

      - name: Install clang for ScriptC
        if: runner.os == 'Linux'
        run: sudo apt-get install --yes clang

      - run: bun run scriptc:build

      # Keep the gate's own output. A red gate on a runner was unreadable from
      # outside the repository: the job log needs admin rights, and nothing
      # else survived the job. This gate has been red on every run since the
      # workflow existed while it passed on the author's machine, and the
      # difference could not be read. An artifact makes the red legible to
      # whoever must fix it, which is the only reason a gate reports at all.
      #
      # `shell: bash` on all three runners: GitHub runs it with `-o pipefail`,
      # so `tee` cannot turn a red gate green.
      - name: Run the gate
        shell: bash
        run: |
          log="gate-${{ matrix.platform }}.log"
          if bun run gate 2>&1 | tee "$log"; then exit 0; fi
          # An artifact needs a token to download and a job log needs admin
          # rights, so neither can be read by the person holding the red.
          # A check annotation is the one channel that is public on a public
          # repository, so the reason rides out on it.
          escape() { printf '%s' "$1" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN{ORS="%0A"}{print}'; }
          fails=$(grep -E '^FAIL' "$log" | head -20)
          if [ -n "$fails" ]; then
            echo "::error title=gate stages that failed::$(escape "$fails")"
          fi
          echo "::error title=gate output, last 80 lines::$(escape "$(tail -80 "$log")")"
          exit 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: gate-log-${{ matrix.platform }}
          path: gate-${{ matrix.platform }}.log
          if-no-files-found: warn
          retention-days: 14

      - name: Prove every source gate can fail
        if: runner.os == 'Linux'
        run: bun scripts/prove-gates-bite.ts

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets

      # The cross-boundary protocol is generated from one schema. Drift here is
      # a silently rejected request at runtime, so it is checked, not trusted.
      - name: Generated protocol is current
        if: runner.os == 'Linux'
        run: |
          bun scripts/generate-native-protocol.ts --check
          bun scripts/generate-themes.ts --check
          git diff --exit-code -- apps/native/src/generated

      - name: Build the Native platform binary
        working-directory: apps/native
        run: bun x native build . --yes -Dplatform=${{ matrix.platform }}

      # Eight journals, one per destination, recorded on a real window by
      # `bun run e2e:record` and replayed here headlessly (null platform: the
      # journal is the world). Three of them also verify every frame's
      # accessibility fingerprint; the five that open a manuscript cannot until
      # M8 closes. This replaces the embedded-browser drivers entirely: there is
      # no browser in the product, so there is no browser in the gate.
      #
      # The replay first compares the protocol version each journal was recorded
      # under with the one compiled into this binary. Without that comparison a
      # protocol change leaves every host answer refused and every fingerprint
      # still agreeing, and the lane reports green while it judges nothing.
      - name: Every destination replays from its journal
        if: runner.os == 'Windows'
        run: bun run e2e:journals

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && runner.os == 'Windows'
        with:
          name: refrain-windows-e2e-evidence
          path: target/e2e-evidence
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: runner.os == 'Windows'
        with:
          name: refrain-windows-debug
          path: apps/native/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 3

  # Evidence does not live here. Each evidence lane names one thing it needs
  # from the machine, and a shared runner meets none of them: the pixel lane
  # needs a GPU view, the window lane needs a real window on the release
  # platform, and a wall-clock budget measured on a shared runner is a reading
  # about the runner. They run from `evidence.yml` and from the author's
  # machine. A lane that runs where its requirement is absent produces a colour
  # that everybody learns to explain away.
