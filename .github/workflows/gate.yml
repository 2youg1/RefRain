name: gate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14
  # Pinned so a toolchain release cannot change what the gate measured. Raising
  # it is a commit with its own evidence, not a silent Monday morning failure.
  RUST_VERSION: "1.97.1"

jobs:
  # The native file layer is built and tested first, on every platform it ships
  # to. A Rust change that only breaks Windows must fail here rather than in a
  # release job that runs after review.
  native:
    name: native (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: windows-latest
            target: win32-x64
          - os: macos-latest
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      # Cache keyed on the lockfile: a dependency change rebuilds, a source
      # change does not.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/fs

      - name: format
        working-directory: packages/fs
        run: cargo fmt --check

      # `-D warnings`: a warning that is allowed to accumulate is a warning
      # nobody reads.
      - name: lint
        working-directory: packages/fs
        run: cargo clippy --all-targets -- -D warnings

      # The guard, the index, the matcher, the sort, and the trash refusals.
      # These run on the real filesystem of each platform, which is the only
      # way a Windows path rule or a macOS trash binding gets tested at all.
      - name: test
        working-directory: packages/fs
        run: cargo test --lib

      - name: build
        working-directory: packages/fs
        run: cargo build --release

      # Use the same filename translation that release packaging uses. A second
      # hand-written `cp` would let this gate pass while the real script broke.
      - name: name the artefact for its platform
        working-directory: packages/fs
        run: bun run scripts/build.ts

      - uses: actions/upload-artifact@v7
        with:
          name: refrain-fs-${{ matrix.target }}
          path: packages/fs/refrain-fs.${{ matrix.target }}.node
          retention-days: 7

  # The three gates from AGENTS.md, plus the checks that only a built bundle can
  # answer. Depends on `native` so the boundary tests run against a real binary
  # rather than skipping and reporting green.
  gate:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/download-artifact@v7
        with:
          name: refrain-fs-linux-x64
          path: packages/fs

      # --frozen-lockfile: CI must fail on an out-of-date lockfile rather than
      # silently resolving different versions than the author tested against.
      - run: bun install --frozen-lockfile

      # Each gate runs unpiped. Piping to head/tee would mask the exit code:
      # `tsc --noEmit | head` exits 0 even with type errors.
      - name: format and lint
        run: bun run fmt:check

      - name: typecheck
        run: bun run check

      - name: test
        run: bun test

      # The desktop build is part of the gate: a renderer that no longer
      # compiles must not reach a release branch.
      - name: build the desktop app
        working-directory: apps/desktop
        run: ./make.sh

      # The main process is bundled for Node; a Bun global there is a crash no
      # test can see, because bun test runs under Bun. This shipped once.
      - name: the main process names no Bun global
        working-directory: apps/desktop
        run: bun scripts/verify-no-bun.ts

      - name: build-shape checks
        working-directory: apps/desktop
        run: bun test test/smoke.test.ts

      - name: install a browser for the rendering checks
        run: bun x playwright install chromium --only-shell

      # The ruled lines must land under the glyphs, not through them. Vision
      # cannot tell those apart in a screenshot; the geometry can.
      - name: ruled lines land under the glyphs
        working-directory: apps/desktop
        run: bun scripts/verify-grid.ts

      # The file browser's claims: a windowed list, columns whose headers sit
      # over their own values, a hairline that is one device pixel, and motion
      # retargeted to the panel. Every one of these shipped broken at least once
      # while passing its unit tests.
      - name: the file browser renders what it claims
        working-directory: apps/desktop
        run: bun scripts/verify-files.ts

      # The bundled faces must actually render. `document.fonts.check` returns
      # true for any substitutable family, so this compares rendered pixels.
      - name: the bundled typefaces render
        working-directory: apps/desktop
        run: bun scripts/verify-render.ts

      # Chapter titles are only labels; two workspace roots may contain the same
      # one. Selection, display, and save must stay bound to the absolute path.
      - name: duplicate chapter titles stay isolated across roots
        working-directory: apps/desktop
        run: bun scripts/verify-multi-root.ts

      # Disk failure must not turn a rejected save into invisible data loss or an
      # unhandled renderer rejection. The author's current text stays dirty.
      - name: a failed save remains visible and recoverable
        working-directory: apps/desktop
        run: bun scripts/verify-save-failure.ts

      # A command may fail after the send IPC has already returned. The panel
      # must refresh the terminal state and its reason without a second click.
      - name: a slow run failure reaches the open panel
        working-directory: apps/desktop
        run: bun scripts/verify-run-refresh.ts

      # An outside edit is the one moment two versions of the manuscript exist.
      # This asserts the dialog shows both and that neither wins on its own.
      - name: an outside edit offers a real choice
        working-directory: apps/desktop
        run: bun scripts/verify-conflict.ts

      # The About page carried a hand-typed "0.1.2" for a whole release. This
      # reads the rendered text and compares it with package.json.
      - name: the About page states this version and links to this project
        working-directory: apps/desktop
        run: bun scripts/verify-about.ts

      - name: the rail seam is drawn
        working-directory: apps/desktop
        run: bun scripts/verify-seam.ts

      # SPEC Q5: the chapter header does not share the manuscript's left edge.
      # The check is wired in reporting-only until the defect is fixed — a
      # verification script that lives outside CI stops being true without
      # anyone noticing, which is exactly what happened to this one.
      - name: chapter header alignment (SPEC Q5, known defect)
        working-directory: apps/desktop
        continue-on-error: true
        run: bun scripts/verify-anchor.ts

      # Speed is the file layer's reason to exist, so it is measured on every
      # run and the numbers are kept. A threshold set from one run on a shared
      # CI machine would fail randomly; recording the series lets a regression
      # be seen against its own history instead.
      - name: measure the file layer
        working-directory: packages/fs
        run: BENCH_FILES=20000 bun bench/file-layer.bench.ts | tee bench-result.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rendered-screens
          path: apps/desktop/shots/
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench
          path: packages/fs/bench-result.txt
          retention-days: 30

  # The packaging configuration is only exercised on the day someone ships.
  # Three defects in it — an executable name illegal in a path, a desktop entry
  # under the wrong key, and a schema field that does not exist — each surfaced
  # only by running the packager, and each would have blocked a release.
  #
  # `--dir` stops before compression: the schema is validated, the app is laid
  # out, and the native binary's presence in resources is checked, in a fraction
  # of the time a full AppImage takes.
  package:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/download-artifact@v7
        with:
          name: refrain-fs-linux-x64
          path: packages/fs

      - run: bun install --frozen-lockfile

      - name: build the desktop app
        working-directory: apps/desktop
        run: ./make.sh

      - name: the packaging configuration is valid and the app lays out
        working-directory: apps/desktop
        run: bun x electron-builder --linux --publish never --dir

      # A packaged app whose file layer is missing starts, opens a project, and
      # silently has no browser — the degradation path working correctly for
      # entirely the wrong reason.
      - name: the native binary travels with the app
        working-directory: apps/desktop
        run: |
          found=$(find release -name 'refrain-fs.*.node' | head -1)
          if [ -z "$found" ]; then
            echo "the platform binary is not in the packaged resources" >&2
            find release -maxdepth 3 -type d >&2
            exit 1
          fi
          echo "packaged: $found"

      # electron-builder only warns when the icon is missing and ships
      # Electron's default one, which reaches a user as a released application
      # wearing another project's mark.
      - name: the application carries its own icon
        working-directory: apps/desktop
        run: test -s build/icon.png

  # The gate must be provably capable of failing. A misconfigured tsconfig or a
  # piped command turns `check` into a no-op that reports success forever.
  gate-bites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: typecheck rejects ill-typed code
        run: bun run verify:gate

  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile

      # SPEC 1.3: the app process makes no outbound network requests.
      # Caught in CI because a stray import is invisible in review.
      - name: no network in core
        run: bun run verify:no-network

      # A delete that cannot be undone is the one defect this application
      # cannot apologise for. The channel list and the native surface are both
      # asserted, so adding a permanent delete fails here before review.
      - name: delete goes to the trash, everywhere
        run: bun run verify:trash-only

      # This release found three defects in the packaging configuration, an
      # icon CI never generated, and a verification script that had been
      # failing unnoticed — every one of them a check that existed with nothing
      # running it. A check nobody runs reads as coverage while asserting
      # nothing, and one of them invented a defect that reached SPEC.
      - name: every gate has a path that runs it
        run: bun run verify:gates-run
