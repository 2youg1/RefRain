name: gate

on:
  push:
    branches: [main, v0.2-rebuild]
  pull_request:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14
  RUST_VERSION: "1.97.1"

jobs:
  quality:
    name: quality (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install Tauri libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: bun install --frozen-lockfile
      - run: bun run gate

      - name: Prove every source gate can fail
        if: runner.os == 'Linux'
        run: bun scripts/prove-gates-bite.ts

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets

      - name: Generated bindings are current
        if: runner.os == 'Linux'
        run: |
          bun run generate
          git diff --exit-code -- apps/desktop/src/generated

      - run: bun run build:web

      - name: Build the Windows shell
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        run: bun x tauri build --debug --no-bundle

      - name: Install tauri-driver and a matching msedgedriver
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo install tauri-driver --locked
          # The runner's evergreen runtime lags the stable channel (150 vs
          # 151+) and its browser process dies before DevToolsActivePort;
          # bring it current first, then match the driver to it.
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $env:TEMP\wv2boot.exe
          Start-Process -FilePath $env:TEMP\wv2boot.exe -ArgumentList "/silent", "/install" -Wait
          $pv = (Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}').pv
          "WebView2 runtime pv=$pv"
          Invoke-WebRequest -Uri "https://msedgedriver.microsoft.com/$pv/edgedriver_win64.zip" -OutFile $env:TEMP\edgedriver.zip
          Expand-Archive -Force $env:TEMP\edgedriver.zip $env:TEMP\edgedriver
          "REFRAIN_MSEDGEDRIVER=$env:TEMP\edgedriver\msedgedriver.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Writing slice against the real window
        if: runner.os == 'Windows'
        run: bun run e2e:app

      - name: Review loop against the real window
        if: runner.os == 'Windows'
        run: bun run e2e:review

      - name: Dispatch loop against the real window
        if: runner.os == 'Windows'
        run: bun run e2e:dispatch

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && runner.os == 'Windows'
        with:
          name: refrain-windows-e2e-evidence
          path: target/e2e-evidence
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: runner.os == 'Windows'
        with:
          name: refrain-windows-debug
          path: target/debug/refrain-desktop.exe
          if-no-files-found: error
          retention-days: 3
