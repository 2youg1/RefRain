name: gate

on:
  push:
    branches: [main, v0.2-rebuild]
  pull_request:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14
  SCRIPTC_VERSION: "0.0.21"
  RUST_VERSION: "1.97.1"
  ZIG_VERSION: "0.16.0"

jobs:
  quality:
    name: quality (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            binary: zig-out/bin/refrain
          - platform: windows
            os: windows-latest
            binary: zig-out/bin/refrain.exe
          - platform: macos
            os: macos-latest
            binary: zig-out/bin/refrain

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # The Native SDK compiles the product surface. An unpinned Zig changes
      # the binary under us, so the version is declared once and used by all
      # three workflows.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # GTK4 is the Linux window host for the Native SDK. This is the whole
      # platform dependency list now: no embedded browser, no app indicator,
      # no SVG rasteriser.
      - name: Install the Linux window libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-4-dev

      - run: bun install --frozen-lockfile

      # Tier A gates run as compiled executables with no Bun fallback (D15),
      # so the gate cannot start until they exist.
      - name: Install ScriptC
        run: |
          bun install --global scriptc@${{ env.SCRIPTC_VERSION }}
          scriptc --version

      - name: Install clang for ScriptC
        if: runner.os == 'Linux'
        run: sudo apt-get install --yes clang

      - run: bun run scriptc:build

      - run: bun run gate

      - name: Prove every source gate can fail
        if: runner.os == 'Linux'
        run: bun scripts/prove-gates-bite.ts

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets

      # The cross-boundary protocol is generated from one schema. Drift here is
      # a silently rejected request at runtime, so it is checked, not trusted.
      - name: Generated protocol is current
        if: runner.os == 'Linux'
        run: |
          bun scripts/generate-native-protocol.ts --check
          bun scripts/generate-themes.ts --check
          git diff --exit-code -- apps/native/src/generated

      - name: Build the Native platform binary
        working-directory: apps/native
        run: bun x native build . --yes -Dplatform=${{ matrix.platform }}

      # Null platform has no GPU view, so it proves compilation and core logic
      # on every runner while the real-window paths below prove the product.
      - name: Native strict checks on the built contract
        working-directory: apps/native
        run: |
          bun run test:null
          bun run check

      # Native automation replays a recorded journal against the real window.
      # This replaces the embedded-browser drivers entirely: there is no
      # browser in the product, so there is no browser in the gate.
      - name: Writing slice against the real window
        if: runner.os == 'Windows'
        run: bun run e2e:app

      - name: Review loop against the real window
        if: runner.os == 'Windows'
        run: bun run e2e:review

      - name: Dispatch loop against the real window
        if: runner.os == 'Windows'
        run: bun run e2e:dispatch

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && runner.os == 'Windows'
        with:
          name: refrain-windows-e2e-evidence
          path: target/e2e-evidence
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: runner.os == 'Windows'
        with:
          name: refrain-windows-debug
          path: apps/native/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 3

  # Shared-runner wall-clock results are non-blocking Windows evidence.
  performance-evidence:
    name: non-blocking Windows performance evidence
    runs-on: windows-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: bun install --frozen-lockfile
      - run: bun run evidence:performance
