name: Harness adapter
description: Report or request support for a command-line agent harness
labels: ["harness"]
body:
  - type: markdown
    attributes:
      value: |
        RefRain reaches a harness through an adapter, at one of three tiers
        (SPEC §6.1):

        | Tier | Means |
        |---|---|
        | **L0** | File channel — the app writes `request.md`, you run the tool yourself, it writes `result.md`. Works with anything, today, with no adapter. |
        | **L1** | The app launches a command and waits. Costs an argv template. |
        | **L2** | The app reads the harness's own event stream: real session, real token counts. Requires contract tests against a live session (SPEC §6.5). |

        Every harness already works at L0. This form is for raising one to L1
        or L2, or for reporting that an existing adapter has drifted.

  - type: input
    id: harness
    attributes:
      label: Harness
      placeholder: Kimi Code, Aider, Cline, ...
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: Command-line entry point
      placeholder: kimi --prompt-file {request} --out {result}
    validations:
      required: true

  - type: dropdown
    id: tier
    attributes:
      label: Tier you are asking for
      options:
        - L1 — launch a command and wait
        - L2 — read the harness's own session and usage stream
        - An existing adapter has drifted
    validations:
      required: true

  - type: textarea
    id: reporting
    attributes:
      label: What does the harness report, and how
      description: >
        For L2 specifically: does it emit token counts, a session id, and a
        compaction signal? Paste the actual output — a link to documentation
        is not evidence that the field is present in the version people run.

  - type: checkboxes
    id: rules
    attributes:
      label: Two rules an adapter cannot bend
      options:
        - label: >
            Token counts are reported exactly as the harness states them.
            The app performs no arithmetic on them and never displays a price.
          required: true
        - label: >
            The adapter cannot merge anything into the manuscript. It produces
            a Proposal; a human clicks.
          required: true
