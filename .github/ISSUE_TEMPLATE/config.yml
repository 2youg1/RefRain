blank_issues_enabled: false
contact_links:
  - name: Design question, or an argument with SPEC.md
    url: https://github.com/kaile9/refrain/discussions
    about: >
      SPEC.md is the design baseline, and disagreeing with it is a discussion
      rather than a defect. Open questions live in SPEC §12; several are
      genuinely undecided and an argued case can settle one.
  - name: Known limits
    url: https://github.com/kaile9/refrain/blob/main/ROADMAP.md
    about: >
      Unsigned releases, the in-memory agent roster, Claude Code at L1, and the
      trash failing on a volume without a writable trash directory are all
      recorded under "Known limits". No issue needed.
