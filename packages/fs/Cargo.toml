[package]
name = "refrain-fs"
version = "0.1.5"
edition = "2021"
license = "GPL-3.0-only"
description = "RefRain's native file layer: traversal, search, sort, move, link, trash."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
name = "refrain_fs"

[dependencies]
napi = { version = "2", default-features = false, features = ["napi4", "serde-json"] }
napi-derive = "3"

# Parallel directory traversal. `ignore` carries the .gitignore machinery ripgrep
# uses; a manuscript folder full of build output should not drown the index.
ignore = "0.4"

# rayon gives the work-stealing pool the scan and the sort both run on.
rayon = "1"

# SIMD substring search. memchr picks AVX2 at runtime, so one binary stays fast
# on machines that predate it.
memchr = "2"

# The trash crate is the only cross-platform route to a *recoverable* delete:
# IFileOperation on Windows, NSFileManager on macOS, freedesktop.org on Linux.
# Writing this by hand would mean three platform implementations and no undo.
trash = "5"

[features]
default = ["napi-bindings"]
napi-bindings = []

[build-dependencies]
napi-build = "2"

[[example]]
name = "panic-boundary-addon"
path = "test/panic-boundary-addon.rs"
crate-type = ["cdylib"]

[profile.release]
# The file layer is the competitive surface. LTO across the whole graph and a
# single codegen unit cost build time and buy call-path inlining.
lto = "fat"
codegen-units = 1
# napi-rs catches an unwinding panic and turns it into a JavaScript error. Abort
# would terminate Electron before that boundary can run.
panic = "unwind"
strip = true
