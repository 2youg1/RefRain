[workspace]
resolver = "3"
members = [
  "apps/native/host",
  "crates/refrain-core",
  "crates/refrain-store",
  "crates/refrain-host",
  "crates/refrain-app",
]

[workspace.package]
version = "0.0.2"
edition = "2024"
license = "MPL-2.0"
rust-version = "1.97.1"

[workspace.dependencies]
refrain-core = { path = "crates/refrain-core" }
refrain-store = { path = "crates/refrain-store" }
refrain-host = { path = "crates/refrain-host" }
refrain-app = { path = "crates/refrain-app" }

serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
blake3 = "=1.8.7"
thiserror = "=2.0.20"

# Config is ruled TOML (SPEC 10.1, D-N8): a real format needs a real parser,
# and a hand-rolled one would re-create exactly the escaping/typing edge cases
# this crate exists to refuse. Pinned exactly like every direct dependency.
toml = "=1.1.4"
uuid = { version = "=1.26.0", features = ["v7", "serde"] }

# specta derives the cross-boundary type descriptions. The `uuid` feature is
# what lets an Id cross as a string rather than as an opaque struct.
#
# The TypeScript emitters that once sat beside it (specta-typescript,
# tauri-specta) left with Tauri in step 10: the cross-boundary contract is now
# generated by `scripts/generate-native-protocol.ts` into Rust, TypeScript, Zig
# and a C header from one schema, and nothing consumes the old emitters.
specta = { version = "=2.0.0-rc.25", features = ["derive", "uuid"] }

# The store crate owns every database handle; rusqlite appears nowhere else.
directories = "=6.0.0"
rfd = { version = "=0.17.2", default-features = false, features = ["pollster", "xdg-portal"] }
# rfd 已经把它带进依赖树；直接依赖只为把对话框的 owner 窗句柄交给 rfd（staticlib.rs）。
# 与其余 18 个直接依赖一样精确钉住：`"0.6"` 是一个范围，而 rfd 0.17.2 解析到的
# 是 0.6.2，两者一致纯属当下巧合。范围让今天的绿证明不了明天的绿。
raw-window-handle = "=0.6.2"
rusqlite = { version = "=0.40.2", features = ["bundled"] }

# The icon pipeline (C7): SVG needs a real parser (a hand-rolled one is the
# DTD/entity surface the format exists to refuse) and a real rasteriser;
# PNG needs a real decoder. All three are the exact versions usvg 0.47 pins.
resvg = "=0.47.0"
usvg = "=0.47.0"
tiny-skia = "=0.12.0"
image = "=0.25.10"

# RootFiles (C4). Four crates, each carrying a real capability the file layer
# was already built on in v0.1.x: `ignore` is the traversal ripgrep uses (a
# manuscript folder full of build output should not drown the index); `rayon`
# is the work-stealing pool the walk, the sort, and the search share; `memchr`
# picks a SIMD substring kernel at run time; `trash` is the only cross-platform
# route to a *recoverable* delete (IFileOperation on Windows) — writing it by
# hand would mean platform implementations and no undo.
ignore = "=0.4.33"
rayon = "=1.12.0"
memchr = "=2.8.3"
trash = "=5.2.6"

# The rules `docs/AGENTS.md` states for Rust, in the place the compiler reads.
#
# **Every entry here is measured at zero across `--workspace --all-targets`.** A
# level the tree cannot hold would either break the build or, set to `warn`,
# become an error anyway under the CI command `-D warnings`. So this table says
# what is enforced and nothing else.
#
# What is **not** here, with the count `cargo clippy --workspace -- -W
# clippy::<lint>` reported on rustc 1.97.1 for production code alone. The
# command that produces all six at once, and the per-file concentration, are in
# `docs/ARCHITECTURE.md`; re-measure before quoting these:
#
#   arithmetic_side_effects  274    indexing_slicing  106
#   as_conversions           127    string_slice       93
#   expect_used               11    unreachable         1
#
# Those are not oversights and they are not one flag away. `Index<usize>` panics
# because the trait says so; `SourceSnapshot::read` is the documented panicking
# half of a pair whose other half returns `Result`. Turning those into
# `#[expect]` attributes buys attribute noise and hides the design gap, so the
# gap is recorded in `docs/ARCHITECTURE.md` Open items instead, where this
# repository keeps its gaps. `overflow-checks` below is the runtime half of the
# arithmetic entry until the compile-time half can be turned on.
#
# The four `unreachable!` this note used to name stood in
# `manuscript/block_sequence.rs`, where the tree's depth and its node shape are
# not related by a type. They are gone: the descent and the replacement are
# structurally recursive now, and a node whose shape disagrees with the depth it
# was reached at returns `None`, which the caller reports as source drift. **The
# gap they marked is not closed.** A malformed tree is still representable;
# relating depth to shape needs a depth-indexed type whose cost is far above what
# it buys. What changed is that a malformed tree costs one refusal instead of the
# process. The one `unreachable!` left is `store/atomic.rs`, on an unbounded
# counter.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# A construct with no path to a correct answer. Nothing in this tree has one,
# and nothing should acquire one without the review a red build forces.
todo = "deny"
unimplemented = "deny"
# Dead ends that hide a decision the code should be making.
exit = "deny"
mem_forget = "deny"
# Debug residue. `dbg!` in a shipped binary prints an author's manuscript to a
# console nobody reads.
dbg_macro = "deny"
# Float literals that silently change value on the way into the type.
lossy_float_literal = "deny"
# `read_to_string(File::open(p))` loses the path from the error message; the
# `fs::` helpers keep it.
verbose_file_reads = "deny"
# An enum variant written `A {}` reads as a struct variant that lost its fields.
empty_enum_variants_with_brackets = "deny"
# Suppression hygiene. `#[expect]` reports itself when its reason expires;
# `#[allow]` does not, and a suppression without a reason cannot be reviewed.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# Dependency debug info is both the largest artifact this workspace writes and
# the slowest step of every relink, because x86_64-pc-windows-msvc copies it
# into a .pdb beside every binary it links, and this workspace links one per
# test target — 63 of them today, counted by `cargo metadata`. Before this
# switch, 11.6 GB of the 15.0 GB under target/debug/deps was .pdb, and single
# files reached 182 MB. Switching it off for dependencies leaves workspace
# members at `debug = 2`, so source-level debugging and file-and-line
# backtraces of our own code are unchanged; only a backtrace frame inside a
# dependency loses its line number. Measured on this machine over
# `-p refrain-store --tests` on rustc 1.97.1, a one-line-edit relink fell from
# 25-30 s to 12 s, and a clean build's artifacts from 3.86 GB to 1.70 GB.
[profile.dev.package."*"]
debug = false

[profile.release]
strip = true
lto = true
codegen-units = 1
# The root AGENTS.md dislike list opens with silently overflowing arithmetic,
# and release is the one profile where the compiler permits it. 274 production
# expressions still do bare integer arithmetic (see the note above the lint
# table), so this is where that half is caught: a wrong offset written into a
# manuscript is worse than a crash that never writes one. Debug already checks;
# this makes the profile the author ships agree with the profile they test.
overflow-checks = true
